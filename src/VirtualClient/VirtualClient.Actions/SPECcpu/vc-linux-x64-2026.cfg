#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config for gcc/g++/gfortran on Linux x86_64.
# Based on the SPEC CPU 2026 Example-gcc-linux-x86.cfg configuration.
#------------------------------------------------------------------------------

sysinfo_program = $[top]/runspeccpu.sh --sysinfo

%ifndef %{label}
%   define label "AzureVirtualClient"
%endif

%ifndef %{build_ncpus}
%   define build_ncpus 8
%endif

default:
   bench_post_setup     = sync
   command_add_redirect = 1
   flagsurl             = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   label                = %{label}
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = --jobs=%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base,peak
   copies               = 1
   threads              = 4

#------- Compilers ------------------------------------------------------------
%ifndef %{gcc_dir}
%   define gcc_dir "/usr"
%endif

%define GCCge10

default:
   preENV_LD_LIBRARY_PATH = %{gcc_dir}/lib64/:%{gcc_dir}/lib/:/lib64
   SPECLANG               = %{gcc_dir}/bin/
   CC                     = $(SPECLANG)gcc      -std=c18   -m64
   CXX                    = $(SPECLANG)g++      -std=c++17 -m64
   FC                     = $(SPECLANG)gfortran -std=f2018 -m64
   CC_VERSION_OPTION      = --version
   CXX_VERSION_OPTION     = --version
   FC_VERSION_OPTION      = --version

#------- Portability ----------------------------------------------------------
800.pot3d_s:
   PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   PORTABILITY = -fno-finite-math-only

734.vpr_r,834.vpr_s:
   PORTABILITY = -fno-finite-math-only

735.gem5_r,835.gem5_s:
   PORTABILITY = -fno-finite-math-only

736.ocio_r:
   PORTABILITY = -fno-finite-math-only

737.gmsh_r:
   PORTABILITY = -fno-fast-math

748.flightdm_r:
   PORTABILITY = -fno-fast-math -ffp-contract=off

753.ns3_r,853.ns3_s:
   PORTABILITY = -fno-finite-math-only

767.nest_r,867.nest_s:
   PORTABILITY      = -fno-finite-math-only
   PORTABILITY_LIBS = -lstdc++fs

# GCC 10 and later require this workaround for legacy Fortran argument types.
%ifdef %{GCCge10}
default:
   EXTRA_FFLAGS = -fallow-argument-mismatch
%endif

#------- Tuning ---------------------------------------------------------------
intspeed,fpspeed:
   preENV_OMP_STACKSIZE = 120M

doconcurrent:
   EXTRA_FOPTIMIZE = -ftree-parallelize-loops=$Threads$

openmp:
   EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP

cxxthreads:
   EXTRA_OPTIMIZE = -pthread

default=base:
   OPTIMIZE = $BaseOptimizingFlags$

default=peak:
   OPTIMIZE    = $PeakOptimizingFlags$
   PASS1_FLAGS = -fprofile-generate
   PASS2_FLAGS = -fprofile-use

#------- Tester and System Descriptions ---------------------------------------
# These placeholders match the CPU2017 VC templates. Sysinfo fills fields that
# it can discover; submission-specific values must be supplied by the tester.
default:
   sw_compiler001      = C/C++/Fortran: GCC
   sw_compiler002      = GNU Compiler Collection
   sw_compiler_category = Community
   sw_base_ptrsize     = 64-bit
   sw_peak_ptrsize     = 64-bit
   hw_vendor           = My Corporation
   tester              = My Corporation
   test_sponsor        = My Corporation
   license_num         = nnn (Your SPEC license number)
   hw_avail            = # Nov-2099
   sw_avail            = # Nov-2099
   fw_bios             = # Version and release date
   hw_cpu_nominal_mhz  = # 9999
   hw_cpu_max_mhz      = # 9999
   hw_model            = # System model
   hw_ncores           = # Number of enabled cores
   hw_ncpuorder        = # Supported chip ordering
   hw_nthreadspercore  = # Number of enabled threads per core
   hw_cooling          = Air
   hw_other            = # None
   hw_pcache           = # Primary cache
   hw_scache           = # Secondary cache
   hw_tcache           = # Tertiary cache
   hw_ocache           = # Other cache or None
   sw_other            = # None
   power_management    = # Power-management settings
