#------------------------------------------------------------------------------
# SPEC CPU(R) 2026 config for GCC on Windows x86_64.
# Based on the SPEC CPU 2026 GCC configuration and adapted to VirtualClient's
# Cygwin compiler installation.
#------------------------------------------------------------------------------

%ifndef %{label}
%   define label "AzureVirtualClient"
%endif

%ifndef %{build_ncpus}
%   define build_ncpus 8
%endif

%define os linux
%define GCCge10

default:
   command_add_redirect = 0
   flagsurl1            = $[top]/config/flags/gcc.xml
   ignore_errors        = 1
   iterations           = 1
   label                = %{label}
   line_width           = 1020
   log_line_width       = 1020
   makeflags            = -j%{build_ncpus}
   mean_anyway          = 1
   output_format        = txt,html,cfg,pdf,csv
   preenv               = 1
   reportable           = 0
   tune                 = base,peak
   copies               = 1
   threads              = 4

#------- Compilers ------------------------------------------------------------
%ifndef %{gcc_dir}
%   define gcc_dir "C:/tools/cygwin"
%endif

default:
   preENV_LD_LIBRARY_PATH = %{gcc_dir}/lib64/:%{gcc_dir}/lib/
   SPECLANG           = %{gcc_dir}/bin/
   CC                 = $(SPECLANG)gcc      -std=c18   -m64
   CXX                = $(SPECLANG)g++      -std=c++17 -m64
   FC                 = $(SPECLANG)gfortran -std=f2018 -m64
   OBJ                = .o
   OBJOPT             = -c -o $@
   LDOUT              = -o $@
   EXTRA_CFLAGS       =
   EXTRA_CXXFLAGS     =
   EXTRA_FFLAGS       =
   EXTRA_FPPFLAGS     =
   CC_VERSION_OPTION  = --version
   CXX_VERSION_OPTION = --version
   FC_VERSION_OPTION  = --version
   LDOPTIONS          = -static-libstdc++

721.gcc_r,821.gcc_s,723.llvm_r,823.llvm_s,729.abc_r,829.abc_s,735.gem5_r,835.gem5_s:
   NEEDATFILE = 1

721.gcc_r,821.gcc_s:
   makeflags = -j1
   EXTRA_PORTABILITY = -include speccpu-cygwin-gcc.h

753.ns3_r,853.ns3_s:
   makeflags  = --always-make
   NEEDATFILE = 1

#------- Portability ----------------------------------------------------------
default:
   PORTABILITY = -I/usr/local/include/speccpu2026 -USPEC_WINDOWS -USPEC_CPU_WINDOWS -UWIN32 -U_WIN32 -UMS_WINDOWS -DSPEC_LINUX -D_GNU_SOURCE

800.pot3d_s:
   EXTRA_PORTABILITY = -DSPEC_SUPPRESS_LOCAL_AND_REDUCE

710.omnetpp_r:
   makeflags         = -j1 BENCH_FLAGS=
   EXTRA_PORTABILITY = -Isimulator -Isimulator/include -Isimulator/include/omnetpp -DSPEC_AUTO_SUPPRESS_THREADING -include speccpu-cygwin-omnetpp.h -fno-finite-math-only -include io.h -UHAVE_PTHREAD_STUBS -Dftello64=ftello -Dfseeko64=fseeko -Dstat64=stat -Dfstat64=fstat

714.cpython_r:
   EXTRA_PORTABILITY = -include io.h -UHAVE_PTHREAD_STUBS

723.llvm_r,823.llvm_s:
   EXTRA_PORTABILITY = -Dlseek64=lseek

734.vpr_r,834.vpr_s:
   EXTRA_PORTABILITY = -fno-fast-math

735.gem5_r,835.gem5_s:
   EXTRA_PORTABILITY = -fno-finite-math-only

736.ocio_r:
   EXTRA_PORTABILITY = -fno-finite-math-only -include alloca.h

817.flac_s:
   EXTRA_PORTABILITY = -DFLAC__NO_DLL -include speccpu-cygwin-flac.h

838.diamond_s:
   makeflags = -j1

737.gmsh_r:
   EXTRA_PORTABILITY = -fno-fast-math

748.flightdm_r:
   EXTRA_PORTABILITY = -fno-fast-math -ffp-contract=off

753.ns3_r,853.ns3_s:
   EXTRA_PORTABILITY = -fno-finite-math-only

766.femflow_r:
   EXTRA_PORTABILITY = -include speccpu-cygwin-femflow.h

767.nest_r,867.nest_s:
   EXTRA_PORTABILITY = -fno-finite-math-only
   PORTABILITY_LIBS  = -lstdc++fs

%ifdef %{GCCge10}
default:
   EXTRA_FFLAGS = -fallow-argument-mismatch
%endif

#------- Tuning ---------------------------------------------------------------
specspeed:
   EXTRA_OPTIMIZE = -fopenmp -DSPEC_OPENMP

default=base:
   OPTIMIZE = $BaseOptimizingFlags$

default=peak:
   OPTIMIZE    = $PeakOptimizingFlags$
   PASS1_FLAGS = -fprofile-generate
   PASS2_FLAGS = -fprofile-use

#------- Tester and System Descriptions ---------------------------------------
default:
   sw_compiler001      = C/C++/Fortran: GCC
   sw_compiler002      = VirtualClient Cygwin toolchain
   sw_compiler_category = Community
   sw_base_ptrsize     = 64-bit
   sw_peak_ptrsize     = 64-bit
   hw_vendor           = My Corporation
   tester              = My Corporation
   test_sponsor        = My Corporation
   license_num         = nnn (Your SPEC license number)
   hw_avail            = # Nov-2099
   sw_avail            = # Nov-2099
   fw_bios             = # Version and release date
   hw_cpu_nominal_mhz  = # 9999
   hw_cpu_max_mhz      = # 9999
   hw_model            = # System model
   hw_ncores           = # Number of enabled cores
   hw_ncpuorder        = # Supported chip ordering
   hw_nthreadspercore  = # Number of enabled threads per core
   hw_cooling          = Air
   hw_other            = # None
   hw_pcache           = # Primary cache
   hw_scache           = # Secondary cache
   hw_tcache           = # Tertiary cache
   hw_ocache           = # Other cache or None
   sw_other            = # None
   power_management    = # Power-management settings
