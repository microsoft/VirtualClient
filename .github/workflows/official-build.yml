# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Official Build

on:
  release:
    types: [published]
  workflow_dispatch: # This enables the manual button
    inputs:
        version_suffix:
          description: 'Version suffix (e.g. beta)'
          required: false
          default: 'beta'
          type: string

jobs:
  publish:
    name: Official Build and Test
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

    # Define environment variables for the job. 
    # TIP: If using a repository-level variable from GitHub Settings > Secrets and variables > Actions, 
    # replace ${{ env.VERSION_SUFFIX }} with ${{ vars.VERSION_SUFFIX }}.
    env:
      REPO_ROOT: ${{ github.workspace }}
      VERSION_SUFFIX: ${{ inputs.version_suffix }}

    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

      # Build the source code projects.
    - name: Build
      shell: cmd
      run: |
        call "%REPO_ROOT%\build.cmd"

    - name: Build Packages
      shell: cmd
      run: |
        if "%VERSION_SUFFIX%" == "" (
            echo:
            echo Building stable release...
            call "%REPO_ROOT%\build-packages.cmd"
        ) else (
            echo:
            echo Building '%VERSION_SUFFIX%' release...
            call "%REPO_ROOT%\build-packages.cmd" --suffix -%VERSION_SUFFIX%
        )

